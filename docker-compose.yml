services:
  ziwoas:
    build: .
    image: ziwoas:latest
    container_name: ziwoas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Berlin
      SECRET_KEY_BASE: dummy_secret_for_local_docker
    volumes:
      - ./storage:/rails/storage
      - ./config/ziwoas.yml:/rails/config/ziwoas.yml:ro

  ziwoas_collector:
    image: ziwoas:latest
    container_name: ziwoas_collector
    restart: unless-stopped
    command: ["./bin/ziwoas_collector"]
    # The Govee LAN protocol answers via multicast on UDP 4002, which never
    # crosses a Docker bridge network. Host networking is the only way the
    # collector sees those replies (and the 8 s LAN reconcile they carry).
    network_mode: host
    environment:
      TZ: Europe/Berlin
      SECRET_KEY_BASE: dummy_secret_for_local_docker
    volumes:
      - ./storage:/rails/storage
      - ./config/ziwoas.yml:/rails/config/ziwoas.yml:ro
    depends_on:
      - ziwoas

  ziwoas_jobs:
    image: ziwoas:latest
    container_name: ziwoas_jobs
    restart: unless-stopped
    command: ["./bin/jobs"]
    environment:
      TZ: Europe/Berlin
      SECRET_KEY_BASE: dummy_secret_for_local_docker
    volumes:
      - ./storage:/rails/storage
      - ./config/ziwoas.yml:/rails/config/ziwoas.yml:ro
    depends_on:
      - ziwoas
