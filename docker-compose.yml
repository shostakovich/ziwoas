services:
  ziwoas:
    image: ghcr.io/shostakovich/ziwoas:${ZIWOAS_TAG:?set ZIWOAS_TAG, e.g. phoenix-2026-10-07}
    container_name: ziwoas
    restart: unless-stopped
    # Govee LAN answers via multicast, which never crosses a Docker bridge network.
    network_mode: host
    # The SEN66 on USB serial (ADR-0009): the host's /dev read-only, so the by-id link and a
    # replugged board resolve; the CDC ACM devices allowed; the host's dialout group (gid 20).
    device_cgroup_rules:
      - "c 166:* rmw"
    group_add:
      - "20"
    environment:
      TZ: Europe/Berlin
      PORT: 3000
      SHELLY_PORT: 3001
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate one with: openssl rand -hex 64}
      PHX_HOST: ${PHX_HOST:-localhost}
      ZIWOAS_ALLOWED_HOSTS: ${ZIWOAS_ALLOWED_HOSTS:-}
    volumes:
      # Owned by uid 1000.
      - ./storage:/app/storage
      - ./config/ziwoas.yml:/app/config/ziwoas.yml:ro
      - /dev:/host-dev:ro
