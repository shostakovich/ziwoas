services:
  ziwoas:
    # A published tag (docker.yml), or `build: .` for a local image.
    image: ghcr.io/shostakovich/ziwoas:${ZIWOAS_TAG:?set ZIWOAS_TAG, e.g. phoenix-2026-10-07}
    container_name: ziwoas
    restart: unless-stopped
    # The Govee LAN protocol answers via multicast on UDP 4002, which never crosses a
    # Docker bridge network; Modbus, MQTT and the Fritz!Box are on the LAN too.
    network_mode: host
    environment:
      TZ: Europe/Berlin
      PORT: 3000
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate one with: openssl rand -hex 64}
      PHX_HOST: ${PHX_HOST:-localhost}
      # Hosts the browser reaches ZiWoAS under, for LiveView's origin check.
      ZIWOAS_ALLOWED_HOSTS: ${ZIWOAS_ALLOWED_HOSTS:-}
    volumes:
      # The database, its WAL and the nightly backups (uid 1000, as before).
      - ./storage:/app/storage
      - ./config/ziwoas.yml:/app/config/ziwoas.yml:ro
