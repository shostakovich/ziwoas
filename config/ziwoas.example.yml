# Copy to config/ziwoas.yml and edit to your setup.
# Where the house stands. The timezone is required; lat and lon are optional,
# but only as a pair — without them there is no sun position and no weather.
location:
  timezone: Europe/Berlin
  lat: 52.52
  lon: 13.405

# Solakon One – Regelung über Modbus TCP (ADR-0002).
# Ohne diesen Block ist die Regelung aus.
# solakon:
#   host: 192.168.1.50
#   port: 502
#   unit_id: 1
#   monitoring_enabled: true
#   control_enabled: false

# fritz_box:
#   host: 192.168.178.1
#   user: fritz6584
#   password: secret
#
# fritz_poll:
#   active_interval_seconds: 5
#   idle_interval_seconds: 60
#   idle_threshold_w: 10
#   timeout_seconds: 2

# Optional: push compact widget data to TRMNL custom plugins.
# Each URL is independent; an absent URL turns its push job into a no-op.
# trmnl:
#   energy_webhook_url:  https://trmnl.com/api/custom_plugins/<energy-uuid>
#   sensors_webhook_url: https://trmnl.com/api/custom_plugins/<sensors-uuid>

# Govee lights bridge (LAN-first + Platform API). Omit to disable.
# govee:
#   api_key: "your-govee-api-key"
#   lan_poll_seconds: 8
#   api_poll_seconds: 180
#   pending_window_seconds: 5
#   devices:
#     - key: 14ABDB4844064B60   # MAC, colons stripped, uppercase
#       name: Uplighter
#       room: Wohnzimmer

# Shelly: set Settings → Outbound Websocket to ws://<ziwoas host>:<SHELLY_PORT>/shelly/<id>.
plugs:
  - id: bkw
    name: Balkonkraftwerk
    role: producer

  # - id: kuehlschrank
  #   name: Kuehlschrank
  #   role: consumer
  #   room: Küche
  #   # switchable: true   # zeigt den Plug im "Schalten"-Tab (nur Shelly)
  #
  # - id: waschmaschine
  #   name: Waschmaschine
  #   role: consumer
  #   driver: fritz_dect
  #   ain: "11630 0206224"

# SwitchBot integration. Token & Secret aus der SwitchBot-App holen:
# Profil → Einstellungen → 10× auf "App-Version" tippen → Entwickleroptionen.
# switchbot:
#   token: "..."
#   secret: "..."
#
# sensors:
#   - id: "ABCDEF123456"           # Geräte-ID aus GET /v1.1/devices der SwitchBot-API
#     name: "Wohnzimmer"
#     type: meter_pro_co2           # meter_pro_co2 | outdoor_meter | sen66
#     room: "Wohnzimmer"            # optional
#
#   - id: "112233445566"
#     name: "Balkon"
#     type: outdoor_meter
#
#   # SEN66 an USB (Firmware aus ziwoas-airquality), ohne SwitchBot-Zugang nutzbar.
#   # Führt im Raum vor dem Meter Pro CO2 (ADR-0009).
#   - id: "19B8E27966467D7A"       # Seriennummer des SEN66, wie die Firmware sie meldet
#     name: "Raumluft"
#     type: sen66
#     room: "Wohnzimmer"
#     port: /host-dev/serial/by-id/usb-Adafruit_Feather_RP2040_Adalogger_DF6380824F1E1330-if00   # Host-/dev unter /host-dev
