# Copy to config/ziwoas.yml and edit to your setup.
# Where the house stands. The timezone is required; lat and lon are optional,
# but only as a pair — without them there is no sun position and no weather.
location:
  timezone: Europe/Berlin
  lat: 52.52
  lon: 13.405

mqtt:
  host: 192.168.1.103
  port: 1883
  topic_prefix: shellies

# Solakon One – Null-Einspeisung (Steuerung per Modbus TCP).
# Ohne diesen Block ist die Regelung aus.
# solakon:
#   host: 192.168.1.50
#   port: 502
#   unit_id: 1
#   monitoring_enabled: true
#   control_enabled: false

# fritz_box:
#   host: 192.168.178.1
#   user: fritz6584
#   password: secret
#
# fritz_poll:
#   active_interval_seconds: 5
#   idle_interval_seconds: 60
#   idle_threshold_w: 10
#   timeout_seconds: 2

# Optional: push compact widget data to TRMNL custom plugins.
# Each URL is independent; an absent URL turns its push job into a no-op.
# trmnl:
#   energy_webhook_url:  https://trmnl.com/api/custom_plugins/<energy-uuid>
#   sensors_webhook_url: https://trmnl.com/api/custom_plugins/<sensors-uuid>

# Govee lights bridge (LAN-first + Platform API). Omit to disable.
# api_key is your Govee developer key; it lives here in the gitignored
# ziwoas.yml (like fritz_box.password), not in any other file.
# govee:
#   api_key: "your-govee-api-key"
#   lan_poll_seconds: 8
#   api_poll_seconds: 180
#   pending_window_seconds: 5
#   devices:
#     - key: 14ABDB4844064B60   # MAC, colons stripped, uppercase
#       name: Uplighter
#       room: Wohnzimmer

plugs:
  - id: bkw
    name: Balkonkraftwerk
    role: producer

  # - id: kuehlschrank
